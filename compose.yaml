services:
  forum:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/data
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      SEED_DEMO: ${SEED_DEMO:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_API: ${ASSISTANT_API:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_REASONING: ${OPENAI_REASONING:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_TITLE_MODEL: ${ASSISTANT_TITLE_MODEL:-}
      ASSISTANT_EFFORT: ${ASSISTANT_EFFORT:-low}
      ASSISTANT_RATE_LIMIT: ${ASSISTANT_RATE_LIMIT:-12}
      ASSISTANT_DAILY_LIMIT: ${ASSISTANT_DAILY_LIMIT:-300}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      WEB_SEARCH_URL: ${WEB_SEARCH_URL:-}
      WEB_SEARCH_PER_ANSWER: ${WEB_SEARCH_PER_ANSWER:-5}
    volumes:
      - forum_data:/app/data
      - forum_backups:/app/backups
    expose:
      - "3001"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      forum:
        condition: service_healthy
volumes:
  forum_data:
  forum_backups:
  caddy_data:
  caddy_config:
